name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest --cov=detectability --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-detectability .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app ai-detectability
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf -X POST http://localhost:8000/api/predict \
            -H 'content-type: application/json' \
            -d '{"text":"Additionally, it is important to note that numerous individuals utilize digital tools to enhance their productivity in various professional contexts."}'
